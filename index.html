<button onclick="testBridge()">Native Share Test</button>

<script>
function testBridge() {
  const payload = {
    key: "share",
    value: {
      desc: "Bridge PoC",
      title: "Bridge PoC",
      url: "https://nurbayram.github.io/webview-poc/"
    }
  };

  try {
    Android.sendAppMessage(JSON.stringify(payload));
    alert("Android.sendAppMessage çağrıldı");
  } catch (e) {
    alert("Bridge hatası: " + e);
  }
}
</script>
